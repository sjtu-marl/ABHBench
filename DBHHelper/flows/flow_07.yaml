CHAPTER:
  chapter: 7
DEFAULT_GAME_SPEED: 1
PROTAGONIST_SUMMARY: Kara is an AX400 model marketed in 2032 by CyberLife. The AX400 is designed to take care of the housework and look after young children. They can speak 300 different languages, cook more than 9000 dishes, help children with their homework and play with them. This model is highly popular because of its ability to get along with young children. After technical difficulties on the assembly line, which should have led to her disassembly, Kara was sent to a store where she was quickly sold for the first time. She was then resold and changed hands several times before being purchased by a certain Todd Williams. The name “Kara” is thought to have been given to her by Alice, but it is quite possible that it was Kara who first whispered this name to Alice… Having been damaged, following what Todd described as a \"stupid accident\", Kara was sent for repairs several times, where her memory was reset on each occasion...
CHAPTER_SUMMARY:  Kara, serving dinner, witnesses Todd's volatile behavior, which quickly spirals into a dangerous situation for Alice.
KEY_CHARACTERS:
  - Kara
  - Alice
  - Todd
