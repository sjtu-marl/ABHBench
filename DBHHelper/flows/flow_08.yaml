        Carl: Humans… are fragile machines…
        Markus: Carl, don't leave, okay? Please, don't go… Don't leave!
        Carl: Remember, Markus… Don't let anybody… Tell you who you are…
        Markus: No... No... Dad! No, please!
        Leo: This is all your fault… This never would have happened if it weren't for you.
        Police: Over here! This way!
        Leo: The android… It was the android!
