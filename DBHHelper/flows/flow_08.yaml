CHAPTER_SUMMARY: Carl Manfred, an elderly artist, and his android companion, Markus, return home from a party.
PROTAGONIST_SUMMARY: Markus is a prototype, gifted by Elijah Kamski to his friend and celebrated painter Carl Manfred after Manfred lost the use of his legs. He was initially developed as part of a CyberLife secret program aimed at elaborating a new generation of autonomous androids. Markus helps the old man in all everyday tasks but mostly provides companionship. After his accident, Manfred became a recluse and stopped painting. Markus' presence helped him gradually regain a taste for life. A special relationship slowly grew between the old man and the android. Initially only seeing Markus as a sophisticated yet stupid machine, ultimately Manfred cultivated an attachment to Markus which flourished into a \"father-son\" relationship. Unconditionally devoted to his master, Markus heeds his advice, studies literature and music, listens to the old man philosophize about the world and his warnings about the dangers it holds...
