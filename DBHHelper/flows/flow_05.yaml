        Carl: That is a very odd draw…
    CONTEXT: |
      Carl: Fancy a game of chess?
      Markus: Sure, yeah.
      Carl: Speed chess.
      Markus: Speed chess it is.
  PLAY_CHESS_WIN:
    CHOICES:
      B: JUSTIFY
      A: SORRY
    CHOICES_CONTEXT:
      JUSTIFY: |
        Markus: Well, I know you don't like losing and you don't like when I let you win. So I felt I… didn't have many choices.
        Carl: True. We humans are complicated.
      SORRY: |
        Markus: My apologies, Carl. I thought, I shou-
        Carl: Don't apologize, you did the right thing. I prefer humiliation to pity.
    CONTEXT: |
      Carl: That's what I call a thorough beating… It's not easy for an old man to compete with a machine.
  PLAY_CHESS_LOSE:
    CHOICES:
      B: LIE
      A: TRUTH
    CHOICES_CONTEXT:
      LIE: |
        Markus: Neither, Carl. You just played better!
        Carl: Never throw a match, Markus. If you can win, win. That's what got humanity where it is today.
      TRUTH: |
        Markus: Well, I thought… You'd enjoy winning.
        Carl: Never throw a match, Markus. If you can win, win. That's what got humanity where it is today.
    CONTEXT: |
      Carl: Now, it's just a little bit too easy… Are your circuits rusty? Or are you just taking pity on an old man?
  PLAY_CHESS_DRAW:
    CHOICES:
      B: LIE
      A: TRUTH
    CHOICES_CONTEXT:
      LIE: |
        Markus: Well, maybe you just played better!
        Carl: You don't lie as good as you play chess. We both know that I'm no match for you.
      TRUTH: |
        Markus: Well, I know that you don't like to lose, but you don't like it when I let you win either. A draw feels like an honorable compromise, no?
    CONTEXT: |
      Carl: That is a very odd draw…
