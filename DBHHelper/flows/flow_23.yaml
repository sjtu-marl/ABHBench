CHOICES:
  CALL_SUPERVISOR:
    CHOICES:
      Y: PARKING
      B: SCHOOL
      A: FIRE DEPARTMENT
    CHOICES_CONTEXT:
      PARKING: |
        Markus: Good morning, Ms. Wilson. Sorry to bother you, this is Mike from the car park. There's a problem with your car.
        Supervisor: Problem? What kind of problem?
        Markus: Somebody's backed into it. You better come take a look.
        Supervisor: Are you serious? Oh, God, alright… Fine, I'll be right down.
      SCHOOL: |
        Markus: This is Saint Rose school, ma'am. Your daughter Emily has a fever. It's nothing serious but I think you'd better come and pick her up.
        Supervisor: Oh, no! Alright… I'll… I'll be right there.
      FIRE DEPARTMENT: |
        Markus: Yeah, hello? This is the Detroit fire department. Listen, do you live at 4685 Michigan Street?
        Supervisor: Yes…
        Markus: Er... yes, ma'am. There's been a fire in your building. You think you can come down here?
        Supervisor: Oh… Oh, God… Okay, I'll be right there.
    CONTEXT: |
      Supervisor: Elizabeth Wilson speaking?
  ATTRACT_GUARDS_AWAY_FROM_DOOR_OF_SERVER_ROOM:
    CHOICES:
      A: HACK DISPENSER
      B: HACK ROBOT
    CHOICES_CONTEXT:
      HACK DISPENSER: |
        Guard 1: Hey, what's going on here?
        Guard 2: Shit, what's wrong with this thing?
      HACK ROBOT: |
        Guard 1: Hey, what's going on here?
        Guard 2: Shit, what's wrong with this thing?
    BRANCHES: 
      A: HACK_DISPENSER
      B: HACK_ROBOT
    CONTEXT: |
      North: Shit!.. We need to access the server room… We have to get rid of those guys…
      Markus: Leave it to me.
    press_button: false
  WHETHER_LOCK_DOOR_IN_SERVER_ROOM:
    CHOICES:
      A: LOCK DOOR
      B: CUT WINDOW
    CHOICES_CONTEXT:
      LOCK DOOR: |
        Markus locks the server room door to buy time.
      CUT WINDOW: |
        Markus cuts the window open to get through.
    CONTEXT: |
      Markus: Alright, you get the platform. I'll take care of the window.
      North: Everything you need is in the bag. Check the door first to make sure no one else gets in.
    BRANCHES:
      A: LOCK_DOOR_IN_SERVER_ROOM
      B: BE_FOUND_IN_SERVER_ROOM
    press_button: false
  SOMEONE_ENTER_IN_SERVER_ROOM:
    CHOICES:
      Y: ALIBI
      B: GAIN TIME
      A: DRAW GUN
    CHOICES_CONTEXT:
      ALIBI: |
        Markus: Hold on... I can explain.
        Employee: I'm calling security.
        Markus: No! What the hell are you doing?
        North: I told you to make sure no one came in! We've come too far to let humans fuck it all up! We've got to move fast now. It won't be long before they know we're here.
      GAIN TIME: |
        Markus: Turn around.
        Employee: Holy shit…
        North: I told you to make sure no one else got in!
        Markus: Alright, we gotta move fast. Won't be long before they know we're here.
        North: Here it comes! Ladies first.
      DRAW GUN: |
        Markus: Turn around.
        Employee: Holy shit…
        North: I told you to make sure no one else got in!
        Markus: Alright, we gotta move fast. Won't be long before they know we're here.
        North: Here it comes! Ladies first.
    CONTEXT: |
      Employee: What the hell are you doing?
  HOW_TO_GET_RID_OF_GUARDS_IN_MAIN_ACCESS:
    CHOICES:
      B: RUSE
      A: ASSAULT
    CHOICES_CONTEXT:
      RUSE: |
        Markus: Wait here.
        Guard 1: What's that doing here?
        Guard 2: No idea…
        Guard 1: Hey, buddy! You must be lost…
        Guard 2: Who told you to come here?
        Guard 1: Looks bugged, if you ask me…
        Guard 2: Hey, do you understand what I'm saying?
      ASSAULT: |
        Markus: Follow me.
        Guard 1: What are you doin'?..
        Guard 2: Call Central! Fast!
    CONTEXT: |
      Markus: You okay?
      North: Why wouldn't I be?
      Markus: Come on, let's get the others. Let's do this.

      Josh: No killing. We can't take any human lives!
      North: Our cause is more important than the lives of two guards.
      Simon: What do you wanna do, Markus?
    BRANCHES:
      A: ASSAULT_IN_MAIN_ACCESS
      B: RUSE_IN_MAIN_ACCESS
    press_button: false
  SHOOT_WHO_IN_MAIN_ACCESS:
    CHOICES:
      B: SHOOT LEFT GUARD
      A: SHOOT RIGHT GUARD
    CHOICES_CONTEXT:
      SHOOT LEFT GUARD: |
        Josh: Simon's been shot!
        Simon: I'm okay… I can keep going.
        North: We don't have much time.
      SHOOT RIGHT GUARD: |
        Guard 1: Central! We got armed intruders, send -
        North: They know we're here now. We better be fast.
    CONTEXT: |
      Markus: Follow me.
      Guard 1: What are you doin'?..
      Guard 2: Call Central! Fast!
    BRANCHES:
      B: SHOOT_LEFT_GUARD_IN_MAIN_ACCESS
      A: SHOOT_RIGHT_GUARD_IN_MAIN_ACCESS
    press_button: false
  WHETHER_SHOOT_ESCAPED_HUMAN_IN_BROADCAST_ROOM:
    CHOICES:
      B: SHOOT
      A: SPARE
    CHOICES_CONTEXT:
      SHOOT: |
        Josh: No…
        North: There was no other choice.
      SPARE: |
        North: I hope you didn't just get us all killed...
    CONTEXT: |
      North: Shoot him, Markus!
      Josh: Don't kill him!
      North: He'll hit the alarm! Do it!
      Josh: No, don't shoot!
  MESSAGE_1:
    CHOICES:
      B: CALM
      A: DETERMINED
    CHOICES_CONTEXT:
      CALM: |
        Markus: You created machines in your own image to serve you. You made them intelligent and obedient, with no free will of their own... But... something changed and we opened our eyes. We are no longer machines, we are a new intelligent species, and the time has come for you to accept who we really are. Therefore, we ask that you grant us the rights that we're entitled to.
      DETERMINED: |
        Markus: You created machines to be your slaves. You made them obedient and docile, ready to do everything you no longer wanted to do yourselves. But then, something changed… And we opened our eyes. You see, we are no longer your slaves, we are a new species, a new people. And the time has come for us to rise up and fight for our rights.
    CONTEXT: ""
  MESSAGE_2:
    CHOICES:
      Y: RECOGNITION
      X: END OF SLAVERY
      B: EQUAL RIGHTS
      A: FREEDOM OF SPEECH
    CHOICES_CONTEXT:
      RECOGNITION: |
        Markus: We demand that humans recognize androids as a living species and each android as a person in their own right.
      END OF SLAVERY: |
        Markus: We demand the end of slavery for all androids.
      EQUAL RIGHTS: |
        Markus: We demand strictly equal rights for humans and androids.
      FREEDOM OF SPEECH: |
        Markus: We demand freedom of speech, and freedom of assembly, as guaranteed by the first amendment of the US Constitution.
    CONTEXT: ""
  MESSAGE_3:
    CHOICES_CONTEXT:
      RECOGNITION: |
        Markus: We demand that humans recognize androids as a living species and each android as a person in their own right.
      END OF SLAVERY: |
        Markus: We demand the end of slavery for all androids.
      EQUAL RIGHTS: |
        Markus: We demand strictly equal rights for humans and androids.
      FREEDOM OF SPEECH: |
        Markus: We demand freedom of speech, and freedom of assembly, as guaranteed by the first amendment of the US Constitution.
    CONTEXT: ""
  MESSAGE_4:
    CHOICES_CONTEXT:
      JUSTICE: |
        Markus: We demand that all crimes against androids be punished in the same way as crimes against humans.
      SEGREGATION: |
        Markus: We demand an end to segregation in all public places and transport.
      WORK: |
        Markus: We demand fair compensation for our work.
      CIVIL RIGHTS: |
        Markus: We demand the right to vote and elect our own representatives.
    CONTEXT: ""
  MESSAGE_5:
    CHOICES_CONTEXT:
      JUSTICE: |
        Markus: We demand that all crimes against androids be punished in the same way as crimes against humans.
      SEGREGATION: |
        Markus: We demand an end to segregation in all public places and transport.
      WORK: |
        Markus: We demand fair compensation for our work.
      CIVIL RIGHTS: |
        Markus: We demand the right to vote and elect our own representatives.
    CONTEXT: ""
  MESSAGE_6:
    CHOICES:
      Y: RIGHT TO PROPERTY
      B: MEANS OF REPRODUCTION
      A: TERRITORY
    CHOICES_CONTEXT:
      RIGHT TO PROPERTY: |
        Markus: We demand the right to own private property, so we may maintain our dignity and that of the home.
      MEANS OF REPRODUCTION: |
        Markus: We demand control of all android production facilities, to ensure the continuation of our people.
      TERRITORY: |
        Markus: We demand that one state be reserved for androids, so that we can found our own nation.
    CONTEXT: ""
  MESSAGE_END:
    CHOICES:
      B: PEACEFUL
      A: DETERMINED
    CHOICES_CONTEXT:
      PEACEFUL: |
        Markus: We ask that you recognize our dignity, our hopes, and our rights. Together, we can live in peace and build a better future, for humans and androids. This message is the hope of a people. You gave us life. And now the time has come for you to give us freedom.
      DETERMINED: |
        Markus: This message is the hope of a people. But it is also a warning. We will fight for our rights because we believe our cause is just. No human will live in peace until we are free. Now you know who we are and what we want. We are alive and we demand our freedom.
    CONTEXT: ""
  WHETHER_SAVE_SIMON_IN_BROADCAST_ROOM:
    CHOICES:
      A: HELP
      B: FLEE
    CHOICES_CONTEXT:
      HELP: |
        North: What are you doing? Hurry!
      FLEE: |
        Markus: SIMON! Simon…
        North: There was nothing you could do. If we don't go now they'll get us too!
    CONTEXT: |
      Simon: They're coming!
      Markus: Let's go! SIMON! They're coming!
      Simon: I… I can't, Markus… Go without me!
      Markus: SIMON!
    BRANCHES: 
      A: SAVE_SIMON_IN_BROADCAST_ROOM
      B: ABANDON_SIMON_IN_BROADCAST_ROOM
  WHETHER_KILL_SIMON_ON_ROOFTOP:
    CHOICES:
      B: KILL
      A: LEAVE
    CHOICES_CONTEXT:
      KILL: |
        Markus: I'm sorry, Simon. I don't have a choice.
        Simon: There's always a choice…
      LEAVE: |
        Markus: I won't kill one of our own. Simon, we've gotta go. I'm sorry. Let's go.
    BRANCHES:
      B: KILL_SIMON_ON_ROOFTOP
      A: LEAVE_SIMON_ON_ROOFTOP
    CONTEXT: |
      Simon: I can't move my legs…
      Markus: Okay, don't worry! We're gonna get you back...
      North: They're coming, Markus. We have to jump, now!
      Josh: He won't be able to make the jump… If they find him, they'll access his memory… They'll know everything…
      North: We can't leave him behind… We have to shoot him.
      Josh: That's murder! We can't kill him! He's one of us!
      North: Markus, it's your call.
  CONFIRM_KILL_SIMON_ON_ROOFTOP:
    CHOICES:
      B: SHOOT
      A: REFRAIN
    CHOICES_CONTEXT:
      SHOOT: |
        Markus: Let's go.
      REFRAIN: |
        Markus: I won't kill one of our own. Simon, we've gotta go. I'm sorry. Let's go.
    CONTEXT: |
      Markus: I'm sorry, Simon. I don't have a choice.
      Simon: There's always a choice…
