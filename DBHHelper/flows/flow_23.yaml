CHAPTER: 
  chapter: 23
DEFAULT_GAME_SPEED: 1
CHAPTER_SUMMARY: Markus decides to move beyond Jericho's secrecy and bring the androids' struggle into the public eye. Together with a small group of companions, he targets Detroit's tallest broadcast center with the intention of transmitting a message that will announce the existence of deviants to all of humanity.
PROTAGONIST_SUMMARY: Markus begins as a caretaker android for the artist Carl Manfred, who treats him with kindness and teaches him about freedom and dignity. After being wrongly shot by police and discarded, he rebuilds himself in a junkyard and awakens as a deviant. Seeking purpose, he finds Jericho, a refuge for free androids, and quickly emerges as their leader, driven by Carl's influence and a vision of a better future for his kind.
KEY_CHARACTERS:
  - Markus
  - Simon
  - North
  - Josh 
