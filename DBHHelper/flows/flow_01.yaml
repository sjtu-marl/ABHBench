CHAPTER:
  chapter: 1
DEFAULT_GAME_SPEED: 1
PROTAGONIST_SUMMARY: Connor is a CyberLife RK-series prototype, model RK800. He is designed by the company to investigate and deal with deviant androids and assist the Detroit City Police Department therein.
CHAPTER_SUMMARY: Connor is sent as a negotiator to a hostage situation at the Phillips apartment, where he faces a disgruntled deviant android Daniel who has killed his owner and taken his owner's child Emma hostage.
KEY_CHARACTERS:
  - Connor
  - Daniel
STATS:
  FISH:
